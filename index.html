<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SPA รายได้ & สัญญา</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Mali:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#0d2b5e;--navy2:#163d7f;--green:#b9e05a;--green-soft:#eaf6cf;
  --bg:#f5f9ee;--card:#ffffff;--ink:#0f1a33;--muted:#3a4763;--line:#cfdcb6;
  --warn:#e08e00;--warn-soft:#fff3d6;--bad:#d64545;--bad-soft:#fde3e3;--future:#e4e9f1;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#071631;--card:#0e2449;--ink:#ffffff;--muted:#cdd8ee;--line:#1f3c6e;--green-soft:#1c3a1a;
  --warn-soft:#3b2d0c;--bad-soft:#3d1515;--future:#1a3360;}}
:root[data-theme="dark"]{--bg:#071631;--card:#0e2449;--ink:#ffffff;--muted:#cdd8ee;--line:#1f3c6e;--green-soft:#1c3a1a;--warn-soft:#3b2d0c;--bad-soft:#3d1515;--future:#1a3360;}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Mali','Sarabun','Tahoma',sans-serif;font-size:17px;font-weight:500;line-height:1.65;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
b,strong{font-weight:700}
header{background:var(--navy);color:#fff;padding:18px 16px 54px;position:relative;overflow:hidden}
header::after{content:"";position:absolute;right:-40px;bottom:-60px;width:180px;height:180px;border:22px solid var(--green);border-radius:50%;opacity:.9}
header h1{margin:0;font-size:26px;font-weight:700}
header p{margin:4px 0 0;color:var(--green);font-size:15px;font-weight:600}
main{max-width:860px;margin:-38px auto 0;padding:0 12px 40px;position:relative;z-index:1}
.card{background:var(--card);border-radius:16px;padding:14px;margin-bottom:12px;border:1px solid var(--line)}
.agents{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
.chip{flex:none;border:2px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:8px 16px;font:inherit;font-weight:600;cursor:pointer;display:flex;align-items:center;gap:6px}
.chip.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.chip .dot{width:9px;height:9px;border-radius:50%}
.chip.add{border-style:dashed;color:var(--muted)}
button{font:inherit;cursor:pointer}
.btn{border:none;border-radius:10px;padding:10px 16px;font-weight:600;background:var(--navy);color:#fff}
.btn.green{background:var(--green);color:var(--navy);font-weight:600}
.btn.ghost{background:transparent;color:var(--muted);border:1px solid var(--line)}
.btn.danger{background:transparent;color:var(--bad);border:1px solid var(--bad)}
:focus-visible{outline:3px solid var(--green);outline-offset:2px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:end}
label.f{display:flex;flex-direction:column;gap:4px;font-size:15px;font-weight:600;color:var(--muted);flex:1;min-width:140px}
input,select{font:inherit;font-size:17px;font-weight:600;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:8px 10px;width:100%}
.check{display:flex;gap:8px;align-items:center;font-size:15px;font-weight:500;color:var(--muted);margin-top:10px}
.check input{width:22px;height:22px;flex:none}
/* signature: 12-month track */
.track{display:grid;grid-template-columns:repeat(12,1fr);gap:4px;margin:6px 0 4px}
.cell{aspect-ratio:1;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:700;background:var(--future);color:var(--muted)}
.cell.ok{background:var(--green);color:var(--navy)}
.cell.back{background:var(--green);color:var(--navy);box-shadow:inset 0 0 0 3px var(--navy2)}
.cell.miss{background:var(--warn);color:#3a2500}
.cell.end{background:var(--bad);color:#fff}
.cell.next{background:transparent;border:2px dashed var(--navy2);color:var(--ink)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:14px;font-weight:600;color:var(--muted)}
.legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px;background:var(--c)}
.alert{border-radius:12px;padding:12px 14px;margin:12px 0 0;font-size:16px}
.alert.ok{background:var(--green-soft)}
.alert.warn{background:var(--warn-soft);border-left:5px solid var(--warn)}
.alert.bad{background:var(--bad-soft);border-left:5px solid var(--bad)}
.alert.done{background:var(--green-soft);border-left:5px solid var(--navy)}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
@media(min-width:620px){.stats{grid-template-columns:repeat(4,1fr)}}
.stat{background:var(--bg);border-radius:12px;padding:10px}
.stat b{display:block;font-size:23px;color:var(--ink)}
.stat small{color:var(--muted);font-size:14px;font-weight:600}
.stat.hero{background:var(--navy);color:#fff}.stat.hero b{color:var(--green)}.stat.hero small{color:#c9d6f0}
h2{font-size:20px;font-weight:700;margin:0 0 8px;color:var(--ink)}
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:15px;min-width:680px}
th{background:var(--navy);color:#fff;font-weight:600;padding:9px 8px;text-align:right}
th:first-child,td:first-child{text-align:center}
td{padding:7px 8px;font-weight:500;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
td input{width:120px;text-align:right;padding:7px 9px}
tr.miss td{background:var(--warn-soft)}
tr.end td{background:var(--bad-soft)}
tr.void td{opacity:.45}
.tag{font-size:13px;font-weight:600;padding:2px 9px;border-radius:999px;background:var(--future);color:var(--muted)}
.tag.ok{background:var(--green);color:var(--navy)}.tag.miss{background:var(--warn);color:#3a2500}.tag.end{background:var(--bad);color:#fff}
.tiers{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;font-size:15px}
@media(min-width:620px){.tiers{grid-template-columns:repeat(6,1fr)}}
.tier{border:1px solid var(--line);border-radius:10px;padding:6px;text-align:center}
.tier.on{background:var(--green);border-color:var(--green);color:var(--navy);font-weight:600}
.bar{height:10px;background:var(--future);border-radius:99px;overflow:hidden;margin:8px 0}
.bar i{display:block;height:100%;background:var(--green)}
.ov{display:grid;gap:8px}
.ovi{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:10px;border-radius:12px;background:var(--bg);cursor:pointer;border:none;width:100%;text-align:left;color:var(--ink)}
.muted{color:var(--muted);font-size:15px}
.empty{text-align:center;padding:26px 10px}
.toast{font-weight:600;font-size:16px;position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--navy);color:#fff;padding:8px 16px;border-radius:999px;font-size:14px;opacity:0;transition:opacity .25s;pointer-events:none}
.toast.show{opacity:1}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}
</style>
</head>
<body>
<header>
  <h1>SPA รายได้ & สัญญา</h1>
  <p>Smart Professional Agent 2026 · คำนวณรายได้รับรองและติดตามเป้า FYC</p>
</header>
<main>
  <div class="card">
    <div class="agents" id="agents"></div>
  </div>
  <div id="view"></div>
  <div class="card">
    <h2>สำรองข้อมูล</h2>
    <p class="muted" style="margin:0 0 10px">ข้อมูลบันทึกในเครื่องนี้อัตโนมัติ ควรสำรองเป็นไฟล์ไว้เป็นระยะ</p>
    <div class="row">
      <button class="btn green" id="exp">บันทึกไฟล์สำรอง</button>
      <button class="btn ghost" id="imp">นำเข้าไฟล์สำรอง</button>
      <input type="file" id="file" accept=".json,application/json" hidden>
    </div>
  </div>
</main>
<div class="toast" id="toast"></div>

<script>
const PCT=[.25,.5,.75,1,1,1,1.25,1.25,1.25,1.25,1.25,1.25];
const PLANS=[10000,12000,15000,20000,24000,36000,48000];
const TIERS=[[100,3.5],[150,5],[200,7],[250,9],[300,10],[350,14]];
const KEY='spa-tracker-v1';
const fmt=n=>Math.round(n).toLocaleString('th-TH');
const $=s=>document.querySelector(s);

let state={agents:[],sel:null};
try{const s=localStorage.getItem(KEY);if(s)state=JSON.parse(s);}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state));}catch(e){}}
function toast(t){const el=$('#toast');el.textContent=t;el.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>el.classList.remove('show'),1800);}
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);

/* ===== คำนวณตามเงื่อนไขโครงการ ===== */
function calc(a){
  const P=+a.plan;let last=-1;
  a.fyc.forEach((v,i)=>{if(v!==''&&v!=null)last=i;});
  let cumT=0,cumF=0,earned=0,paid=0,pending=0,bp=0,miss=0,status='active',endM=null;
  const rows=[];
  for(let i=0;i<12;i++){
    const tgt=PCT[i]*P;cumT+=tgt;
    if(i>last||status==='terminated'){rows.push({i,tgt,cumT,future:true,void:status==='terminated'});continue;}
    const f=+a.fyc[i]||0;cumF+=f;
    const ok=cumF>=cumT-0.001;let back=0,lost=false,gIn=0;
    if(ok){
      if(pending>0){if(bp<2){back=pending*P;bp++;}else lost=true;pending=0;}
      gIn=P+back;earned+=gIn;miss=0;
    }else{pending++;miss++;}
    const pay=Math.max(cumF,earned)-paid;paid+=pay;
    if(miss>=2){status='terminated';endM=i+1;}
    rows.push({i,tgt,cumT,f,cumF,ok,gIn,back,lost,earned,pay,term:status==='terminated'&&endM===i+1});
  }
  const total12=12*P;
  const pctFYC=cumF*100/total12;
  let tier=null;TIERS.forEach(t=>{if(pctFYC>=t[0])tier=t;});
  const nextTier=TIERS.find(t=>pctFYC<t[0]);
  const completed=last===11&&status!=='terminated';
  if(completed)status='completed';
  const bonus=tier?tier[1]*P:0;
  const extra=tier&&a.license?2*P:0;
  const mgr=status==='terminated'?Math.max(0,.5*(earned-cumF)):0;
  const nextIdx=last+1;
  let need=null;
  if(status==='active'&&nextIdx<12){need=Math.max(0,rows[nextIdx].cumT-cumF);}
  return{P,rows,last,cumF,earned,paid,status,endM,bp,miss,pctFYC,tier,nextTier,bonus,extra,completed,mgr,nextIdx,need,total12};
}

function statusInfo(r){
  if(r.status==='terminated')return{c:'var(--bad)',t:'ยกเลิกสัญญา'};
  if(r.status==='completed')return{c:'var(--navy2)',t:'จบโครงการ'};
  if(r.miss===1)return{c:'var(--warn)',t:'เตือน: ขาดเป้า 1 เดือน'};
  if(r.last<0)return{c:'var(--muted)',t:'ยังไม่บันทึกผลงาน'};
  return{c:'#7fb321',t:'ผ่านเป้า'};
}

/* ===== UI ===== */
function render(){
  const ag=$('#agents');ag.innerHTML='';
  const ov=document.createElement('button');ov.className='chip'+(state.sel===null?' on':'');ov.textContent='ภาพรวมทีม';
  ov.onclick=()=>{state.sel=null;save();render();};ag.appendChild(ov);
  state.agents.forEach(a=>{
    const r=calc(a),s=statusInfo(r);
    const b=document.createElement('button');b.className='chip'+(state.sel===a.id?' on':'');
    b.innerHTML=`<span class="dot" style="background:${s.c}"></span>`;b.append(a.name||'ไม่มีชื่อ');
    b.onclick=()=>{state.sel=a.id;save();render();};ag.appendChild(b);
  });
  const add=document.createElement('button');add.className='chip add';add.textContent='+ เพิ่มตัวแทน';
  add.onclick=()=>{const a={id:uid(),name:'ตัวแทนใหม่',plan:12000,license:true,fyc:Array(12).fill('')};state.agents.push(a);state.sel=a.id;save();render();setTimeout(()=>$('#nm')?.select(),50);};
  ag.appendChild(add);
  const a=state.agents.find(x=>x.id===state.sel);
  a?renderAgent(a):renderOverview();
}

function renderOverview(){
  const v=$('#view');
  if(!state.agents.length){v.innerHTML=`<div class="card empty"><h2>เริ่มจากเพิ่มตัวแทนคนแรก</h2><p class="muted">ใส่ชื่อ เลือกแผนรับรองรายได้ แล้วกรอก FYC ทีละเดือน แอปจะคำนวณรายได้และเตือนสถานะสัญญาให้</p><button class="btn green" onclick="document.querySelector('.chip.add').click()">+ เพิ่มตัวแทน</button></div>`;return;}
  let tot=0,warn=0,term=0;
  const items=state.agents.map(a=>{const r=calc(a),s=statusInfo(r);tot+=r.paid;if(r.miss===1&&r.status==='active')warn++;if(r.status==='terminated')term++;
    const nx=r.need!=null?`เดือน ${r.nextIdx+1} ต้องทำ FYC อีก ${fmt(r.need)}`:(r.status==='completed'?`โบนัส ${fmt(r.bonus+r.extra)}`:'');
    return`<button class="ovi" data-id="${a.id}"><span><b>${esc(a.name)}</b><br><span class="muted">แผน ${fmt(r.P)} · ${nx}</span></span><span style="text-align:right"><span class="tag" style="background:${s.c};color:#fff">${s.t}</span><br><span class="muted">รับแล้ว ${fmt(r.paid)}</span></span></button>`;}).join('');
  v.innerHTML=`<div class="card"><h2>ภาพรวมทีม</h2><div class="stats" style="margin-bottom:10px">
    <div class="stat hero"><small>ตัวแทนทั้งหมด</small><b>${state.agents.length} คน</b></div>
    <div class="stat"><small>ต้องเฝ้าระวัง</small><b style="color:var(--warn)">${warn} คน</b></div>
    <div class="stat"><small>ยกเลิกสัญญา</small><b style="color:var(--bad)">${term} คน</b></div>
    <div class="stat"><small>รายได้รวมที่จ่ายแล้ว</small><b>${fmt(tot)}</b></div></div>
    <div class="ov">${items}</div></div>`;
  v.querySelectorAll('.ovi').forEach(b=>b.onclick=()=>{state.sel=b.dataset.id;save();render();});
}

function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}

function renderAgent(a){
  const v=$('#view');
  v.innerHTML=`<div class="card">
    <div class="row">
      <label class="f">ชื่อตัวแทน<input id="nm" value="${esc(a.name)}"></label>
      <label class="f">แผนรับรองรายได้ (บาท/เดือน)<select id="pl">${PLANS.map(p=>`<option value="${p}" ${+a.plan===p?'selected':''}>${fmt(p)}</option>`).join('')}</select></label>
    </div>
    <label class="check"><input type="checkbox" id="lic" ${a.license?'checked':''}> มีใบอนุญาตวินาศภัย + ผู้แนะนำการลงทุนเมื่อจบโครงการ (รับเพิ่ม 2 เท่าของแผน)</label>
  </div>
  <div id="out"></div>`;
  $('#nm').oninput=e=>{a.name=e.target.value;save();clearTimeout(renderAgent.t);renderAgent.t=setTimeout(()=>{const keep=document.activeElement.id;renderChipsOnly();},300);};
  $('#pl').onchange=e=>{a.plan=+e.target.value;save();renderOut(a);renderChipsOnly();};
  $('#lic').onchange=e=>{a.license=e.target.checked;save();renderOut(a);};
  renderOut(a);
}
function renderChipsOnly(){
  // refresh chip names/dots without rebuilding the form
  const a=state.agents.find(x=>x.id===state.sel);const chips=[...document.querySelectorAll('#agents .chip')];
  state.agents.forEach((ag,i)=>{const c=chips[i+1];if(!c)return;const r=calc(ag),s=statusInfo(r);c.innerHTML=`<span class="dot" style="background:${s.c}"></span>`;c.append(ag.name||'ไม่มีชื่อ');});
}

function renderOut(a){
  const r=calc(a),o=$('#out');
  const cells=r.rows.map((x,i)=>{let c='';if(!x.future)c=x.term?'end':(x.ok?(x.back?'back':'ok'):'miss');else if(r.status==='active'&&i===r.nextIdx)c='next';return`<div class="cell ${c}" title="เดือน ${i+1}">${i+1}</div>`;}).join('');
  let alert='';
  if(r.status==='terminated')alert=`<div class="alert bad"><b>สัญญาถูกยกเลิกเมื่อสิ้นเดือน ${r.endM}</b> เพราะ FYC สะสมไม่ถึงเป้า 2 เดือนติดต่อกัน<br>ผู้บริหารชดเชย 50% × (แผนรับรองสะสม ${fmt(r.earned)} − FYC สะสม ${fmt(r.cumF)}) = <b>${fmt(r.mgr)} บาท</b></div>`;
  else if(r.status==='completed')alert=`<div class="alert done"><b>จบโครงการครบ 12 เดือน</b> FYC สะสม ${r.pctFYC.toFixed(2)}% ของแผนทั้งปี ${r.tier?`ได้โบนัสพิเศษ ${r.tier[1]} เท่า`:'ยังไม่ถึง 100% จึงไม่ได้โบนัสพิเศษ'}</div>`;
  else if(r.last<0)alert=`<div class="alert ok">กรอก FYC เดือนที่ 1 ในตารางด้านล่างเพื่อเริ่มคำนวณ เป้าเดือนแรก ${fmt(r.rows[0].cumT)} บาท</div>`;
  else if(r.miss===1){const left=2-r.bp;alert=`<div class="alert warn"><b>เดือน ${r.last+1} FYC สะสมไม่ถึงเป้า</b> ยังไม่ได้รายได้รับรองของเดือนนี้<br>เดือน ${r.nextIdx+1} ต้องทำ FYC อย่างน้อย <b>${fmt(r.need)} บาท</b> (สะสมให้ถึง ${fmt(r.rows[r.nextIdx].cumT)}) ไม่เช่นนั้นสัญญาจะถูกยกเลิก<br>${left>0?`ถ้าทำได้ จะได้รับรายได้ย้อนหลัง (เหลือสิทธิ์ ${left} ครั้ง)`:'ใช้สิทธิ์รับย้อนหลังครบ 2 ครั้งแล้ว จะไม่ได้รับเดือนที่ขาดคืน'}</div>`;}
  else alert=`<div class="alert ok">ผ่านเป้าสะสมแล้ว · เดือน ${r.nextIdx+1} ต้องทำ FYC อย่างน้อย <b>${fmt(r.need)} บาท</b> เพื่อรักษาสัญญา · สิทธิ์รับย้อนหลังเหลือ ${2-r.bp} ครั้ง</div>`;

  const tbl=r.rows.map(x=>{
    const i=x.i,val=a.fyc[i]??'';
    if(x.future){const dis=x.void?'disabled':'';return`<tr class="${x.void?'void':''}"><td>${i+1}</td><td>${PCT[i]*100}%</td><td>${fmt(x.cumT)}</td><td><input inputmode="numeric" data-m="${i}" value="${val}" ${dis} placeholder="—"></td><td>—</td><td>—</td><td>—</td><td><span class="tag">${x.void?'ยกเลิกแล้ว':'ยังไม่ถึง'}</span></td></tr>`;}
    const tag=x.term?'<span class="tag end">ยกเลิก</span>':x.ok?`<span class="tag ok">${x.back?'ผ่าน+ย้อนหลัง':'ผ่าน'}</span>`:`<span class="tag miss">ขาดเป้า${x.lost?'':''}</span>`;
    return`<tr class="${x.term?'end':(!x.ok?'miss':'')}"><td>${i+1}</td><td>${PCT[i]*100}%</td><td>${fmt(x.cumT)}</td><td><input inputmode="numeric" data-m="${i}" value="${val}"></td><td>${fmt(x.cumF)}</td><td>${fmt(x.earned)}</td><td><b>${fmt(x.pay)}</b></td><td>${tag}</td></tr>`;}).join('');

  const pct=Math.min(100,r.pctFYC/350*100);
  const tierHtml=TIERS.map(t=>`<div class="tier ${r.tier&&r.tier[0]===t[0]?'on':''}">${t[0]}%+<br><b>${t[1]} เท่า</b><br><span class="muted">${fmt(t[1]*r.P)}</span></div>`).join('');
  const gap=r.nextTier?`ทำ FYC เพิ่มอีก ${fmt(r.nextTier[0]/100*r.total12-r.cumF)} บาท เพื่อขึ้นขั้น ${r.nextTier[1]} เท่า (${r.nextTier[0]}%)`:'ถึงขั้นสูงสุดแล้ว';
  const grand=r.paid+(r.status==='terminated'?0:r.bonus+r.extra);

  o.innerHTML=`<div class="card">
    <h2>เส้นทาง 12 เดือน</h2>
    <div class="track">${cells}</div>
    <div class="legend"><span style="--c:var(--green)">ผ่านเป้า</span><span style="--c:var(--warn)">ขาดเป้า</span><span style="--c:var(--bad)">ยกเลิก</span><span style="--c:var(--future)">ยังไม่ถึง</span></div>
    ${alert}
  </div>
  <div class="card"><div class="stats">
    <div class="stat hero"><small>${r.status==='terminated'?'รายได้รวมที่ได้รับ':(r.completed?'รวมทั้งโครงการ':'คาดการณ์รวม (ถ้าจบตอนนี้)')}</small><b>${fmt(grand)}</b></div>
    <div class="stat"><small>รับแล้วรายเดือน</small><b>${fmt(r.paid)}</b></div>
    <div class="stat"><small>FYC สะสม</small><b>${fmt(r.cumF)}</b></div>
    <div class="stat"><small>แผนรับรองสะสม</small><b>${fmt(r.earned)}</b></div>
  </div></div>
  <div class="card"><h2>ผลงานรายเดือน</h2><p class="muted" style="margin:0 0 8px">กรอก FYC ที่ทำได้ในแต่ละเดือน รายได้ = ค่าที่มากกว่าระหว่าง FYC สะสมกับแผนรับรองสะสม หักที่รับไปแล้ว</p>
    <div class="tbl"><table><thead><tr><th>เดือน</th><th>%</th><th>เป้าสะสม</th><th>FYC เดือนนี้</th><th>FYC สะสม</th><th>แผนรับรองสะสม</th><th>รับเดือนนี้</th><th>สถานะ</th></tr></thead><tbody>${tbl}</tbody></table></div>
  </div>
  <div class="card"><h2>โบนัสพิเศษเมื่อจบโครงการ</h2>
    <div class="muted">FYC สะสม ${fmt(r.cumF)} ÷ แผนทั้งปี ${fmt(r.total12)} = <b style="color:var(--ink)">${r.pctFYC.toFixed(2)}%</b></div>
    <div class="bar"><i style="width:${pct}%"></i></div>
    <div class="tiers">${tierHtml}</div>
    <div class="alert ok">${r.status==='terminated'?'ถูกยกเลิกสัญญา ไม่มีสิทธิ์รับโบนัสพิเศษ':`โบนัส ${fmt(r.bonus)} + เพิ่ม 2 เท่า ${fmt(r.extra)} = <b>${fmt(r.bonus+r.extra)} บาท</b>${r.completed?'':' (ประมาณการ จ่ายเมื่อจบเดือน 12)'}<br>${gap}`}</div>
  </div>
  <div class="card row" style="justify-content:space-between">
    <button class="btn ghost" id="clr">ล้างผลงานทั้งหมด</button>
    <button class="btn danger" id="del">ลบตัวแทนนี้</button>
  </div>`;
  o.querySelectorAll('input[data-m]').forEach(inp=>{
    inp.onchange=e=>{const m=+e.target.dataset.m;const t=e.target.value.replace(/[^\d.]/g,'');a.fyc[m]=t;save();renderOut(a);renderChipsOnly();
      const nx=document.querySelector(`input[data-m="${m+1}"]`);if(nx&&!nx.disabled)nx.focus();};
  });
  $('#clr').onclick=()=>{if(confirm('ล้าง FYC ทุกเดือนของ '+a.name+'?')){a.fyc=Array(12).fill('');save();renderOut(a);renderChipsOnly();}};
  $('#del').onclick=()=>{if(confirm('ลบ '+a.name+' ออกจากแอป?')){state.agents=state.agents.filter(x=>x.id!==a.id);state.sel=null;save();render();}};
}

/* ===== สำรองข้อมูล ===== */
let dl=null;
(async()=>{try{if(window.claude&&claude.use)dl=await claude.use('downloads');}catch(e){}})();
$('#exp').onclick=async()=>{
  const data=JSON.stringify({app:'spa-tracker',v:1,date:new Date().toISOString(),agents:state.agents},null,2);
  const name='spa-backup-'+new Date().toISOString().slice(0,10)+'.json';
  if(dl){try{await dl.save({filename:name,data});toast('บันทึกไฟล์แล้ว');}catch(e){if(e&&e.code!=='declined')toast('บันทึกไฟล์ไม่ได้ในหน้านี้');}return;}
  try{const u=URL.createObjectURL(new Blob([data],{type:'application/json'}));const l=document.createElement('a');l.href=u;l.download=name;document.body.appendChild(l);l.click();l.remove();setTimeout(()=>URL.revokeObjectURL(u),2000);toast('บันทึกไฟล์แล้ว');}
  catch(e){toast('บันทึกไฟล์ไม่ได้ในหน้านี้');}
};
$('#imp').onclick=()=>$('#file').click();
$('#file').onchange=e=>{const f=e.target.files[0];if(!f)return;const rd=new FileReader();
  rd.onload=()=>{try{const d=JSON.parse(rd.result);if(!Array.isArray(d.agents))throw 0;
    if(!confirm(`นำเข้า ${d.agents.length} ตัวแทน? ข้อมูลปัจจุบันจะถูกแทนที่`))return;
    state.agents=d.agents.map(a=>({id:a.id||uid(),name:a.name||'',plan:+a.plan||12000,license:a.license!==false,fyc:(a.fyc||[]).concat(Array(12).fill('')).slice(0,12)}));
    state.sel=null;save();render();toast('นำเข้าข้อมูลแล้ว');}catch(x){toast('ไฟล์ไม่ถูกต้อง ใช้ไฟล์ที่บันทึกจากแอปนี้');}};
  rd.readAsText(f);e.target.value='';};

render();
</script>
</body>
</html>
